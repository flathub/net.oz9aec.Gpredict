app-id: net.oz9aec.Gpredict
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: gpredict
copy-icon: true
rename-icon: gpredict-icon
rename-desktop-file: gpredict.desktop
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --share=network
  - --persist=.config/Gpredict
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/*/girepository-1.0
  - /share/aclocal
  - /share/gir-1.0
  - /share/man
  - /share/gtk-doc
  - /share/doc
  - '*.la'
  - '*.a'
modules:
  - shared-modules/intltool/intltool-0.51.json

  - name: libgoocanvas
    config-opts:
      - --enable-python=no
    sources:
      - type: archive
        url: http://ftp.gnome.org/pub/GNOME/sources/goocanvas/2.0/goocanvas-2.0.4.tar.xz
        sha256: c728e2b7d4425ae81b54e1e07a3d3c8a4bd6377a63cffa43006045bceaa92e90
      - type: patch
        path: goocanvas-fix-build.patch

  - name: hamlib
    sources:
      - type: archive
        url: https://github.com/Hamlib/Hamlib/releases/download/4.7.1/hamlib-4.7.1.tar.gz
        sha256: d197a08a3d5d936d7571ae573f745bbba619e88998742c8267e3fcb0fb3d5974
        x-checker-data:
          type: anitya
          project-id: 1292
          url-template: https://github.com/Hamlib/Hamlib/releases/download/$version/hamlib-$version.tar.gz

  - name: gpredict
    sources:
      - type: git
        url: https://github.com/csete/gpredict
        commit: 0f3beb6adee605cf117ccaeabfe3e4ff6251c0af
        disable-shallow-clone: true
      - type: patch
        path: no-configure.patch
        use-git: true
      - type: file
        path: net.oz9aec.Gpredict.appdata.xml
    post-install:
      - install -Dm644 ${FLATPAK_ID}.appdata.xml /app/share/appdata/${FLATPAK_ID}.appdata.xml
      - for size in 16 24 32 48 64 128 256 512; do rsvg-convert -w $size -h $size
        -f png -o $size.png pixmaps/logos/gpredict_icon_color.svg; install -Dm644
        $size.png /app/share/icons/hicolor/${size}x${size}/apps/gpredict-icon.png;
        done
